services:
  parser:
    build: ./services/parser
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OPERATION_PATH: /review
      UPSTREAM_URL: http://quality:8081/score
    depends_on:
      quality:
        condition: service_healthy
  quality:
    build: ./services/quality
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/health', timeout=1).close()"]
      interval: 1s
      timeout: 2s
      retries: 20
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      OPERATION_PATH: /score
